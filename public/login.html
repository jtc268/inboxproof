<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Sign in | Inboxproof</title><link rel="stylesheet" href="/styles.css"><style>.login{max-width:480px;margin:80px auto;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.login h1{font-size:30px;margin:0 0 12px}.login p{line-height:1.6;color:var(--muted)}.login label{display:block;margin:24px 0 8px}.login input{box-sizing:border-box;width:100%;padding:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;font:inherit}.login button{margin-top:16px;width:100%}#message{min-height:25px;margin:16px 0}main{padding:0 16px}</style></head><body><nav class="nav"><div class="container"><a class="logo" href="/">Inboxproof</a><a href="/">Home</a></div></nav><main><section class="login"><h1>Sign in to your dashboard</h1><p>Use the email you entered at checkout. We’ll email you a secure sign-in link. No password needed.</p><form id="login"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@company.com"><button class="btn btn-primary" type="submit" id="send">Email me a sign-in link</button></form><button id="verify" class="btn btn-primary" hidden>Continue to my dashboard</button><div id="message" role="status" aria-live="polite"></div><p>Need help? <a href="mailto:joec88@gmail.com">Contact support</a></p></section></main><script src="/login.js"></script></body></html>
